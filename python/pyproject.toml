[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "firmaradar-mcp"
version = "0.6.0"
description = "MCP stdio-server exposing Firmaradar's company/person/risk tools to AI agents."
readme = "../README.md"
requires-python = ">=3.10"
# Privat repo bruker "Proprietary"; sync_mcp_public.sh patcher dette til
# "Apache-2.0" når pakken speiles til Tiwas/firmaradar-mcp.
license = "Apache-2.0"
authors = [
    { name = "Firmaradar AS", email = "lars@firmaradar.no" },
]
keywords = ["mcp", "firmaradar", "brreg", "norway", "company", "agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Operating System :: OS Independent",
]
dependencies = [
    # 2.0.0 (sluppet 2026-07-31) fjernet Server.list_tools/call_tool
    # (dekorator-API-et) til fordel for on_list_tools=/on_call_tool=
    # konstruktør-kwargs — server.py migrert 2026-07-31. <3.0 fordi vi ikke
    # har verifisert mot en fremtidig 3.x.
    "mcp>=2.0.0,<3.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/Tiwas/firmaradar-mcp"
Documentation = "https://firmaradar.no/dokumentasjon"
Repository = "https://github.com/Tiwas/firmaradar-mcp"
Issues = "https://github.com/Tiwas/firmaradar-mcp/issues"
Changelog = "https://github.com/Tiwas/firmaradar-mcp/blob/main/python/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]
# `remote` ekstra-en installerer ASGI-stacken som remote_server.py trenger.
# Stdio-serveren (server.py) bruker INGEN av disse, så vanlig pip install
# forblir slank — kun MCP-klienter som vil hoste over HTTPS trenger dem.
remote = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
firmaradar-mcp = "firmaradar_mcp.server:main"
# Remote-HTTP-server for Claude Web + mobile (Android/iOS) connectors.
# Krever ekstra-en `remote`: pip install 'firmaradar-mcp[remote]'.
firmaradar-mcp-remote = "firmaradar_mcp.remote_server:main"

[tool.hatch.build.targets.wheel]
packages = ["firmaradar_mcp"]

# README ligger ett nivå over pyproject.toml (felles for python/ + typescript/).
# Hatchling må eksplisitt forces til å inkludere filer utenfor pakken i sdist.
[tool.hatch.build.targets.sdist]
include = [
    "firmaradar_mcp",
    "tests",
    "../README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
