[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "firmaradar-mcp"
version = "0.3.0a0"
description = "MCP stdio-server exposing Firmaradar's company/person/risk tools to AI agents."
readme = "../README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Firmaradar AS" },
]
keywords = ["mcp", "firmaradar", "brreg", "norway", "company", "agents", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]
# `remote` ekstra-en installerer ASGI-stacken som remote_server.py trenger.
# Stdio-serveren (server.py) bruker INGEN av disse, så vanlig pip install
# forblir slank — kun MCP-klienter som vil hoste over HTTPS trenger dem.
remote = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
firmaradar-mcp = "firmaradar_mcp.server:main"
# Remote-HTTP-server for Claude Web + mobile (Android/iOS) connectors.
# Krever ekstra-en `remote`: pip install 'firmaradar-mcp[remote]'.
firmaradar-mcp-remote = "firmaradar_mcp.remote_server:main"

[tool.hatch.build.targets.wheel]
packages = ["firmaradar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
